<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#f5f1e8">
  <meta name="pronunciation-endpoint" content="">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="stylesheet" href="./styles.css">
  <title>Phonics 聽音跟讀</title>
  <script src="./curriculum.js" defer></script>
  <script src="./pronunciation.js" defer></script>
  <script src="./app.js" defer></script>
</head>
<body>
  <button id="menuToggle" class="corner-button menu-toggle" type="button" aria-expanded="false" aria-controls="sideMenu" aria-label="開啟選單">☰</button>
  <div id="menuBackdrop" class="menu-backdrop" hidden></div>
  <nav id="sideMenu" class="side-menu" aria-label="練習與測驗" inert>
    <p class="eyebrow">選擇功能</p>
    <button data-tab="sound">音標練習</button>
    <button data-tab="blend">拼讀練習</button>
    <button data-tab="record">跟讀練習</button>
    <button data-tab="quiz">聽力選擇題測驗</button>
    <button data-tab="typing">聽力打字測驗</button>
    <button data-tab="exam">綜合測驗</button>
    <button data-tab="mistakes">常錯字</button>
    <button id="studentsToggle" type="button" aria-haspopup="dialog">學生與本機進度</button>
    <button id="settingsToggle" type="button" aria-haspopup="dialog">設定</button>
  </nav>
  <dialog id="settingsDialog" aria-labelledby="settingsTitle">
    <div class="dialog-heading"><h2 id="settingsTitle">工具與設定</h2><button id="closeSettings" type="button" class="secondary" aria-label="關閉工具設定">✕</button></div>
    <section class="speed-settings" aria-labelledby="speedSettingsTitle">
      <h3 id="speedSettingsTitle">慢速播放</h3>
      <label for="slowDuration">播放時間</label>
      <select id="slowDuration">
        <option value="1.5">原慢速播放時間的 1.5 倍</option>
        <option value="2">原慢速播放時間的 2 倍</option>
        <option value="2.5">原慢速播放時間的 2.5 倍</option>
      </select>
      <p id="slowDurationStatus" role="status"></p>
    </section>
    <section class="global-settings" aria-labelledby="hintSettingsTitle">
      <h3 id="hintSettingsTitle">全域提示設定</h3>
      <p>選擇聽力題要顯示的提示按鈕，並設定每題每種提示的使用次數。</p>
      <div id="hintSettings" class="actions"></div>
      <p id="hintSettingsStatus" role="status"></p>
    </section>
    <section class="backup" aria-label="備份進度">
      <h3>備份與還原</h3>
      <button id="export" class="secondary">匯出 JSON 備份</button>
      <label class="file-label">匯入備份 <input type="file" id="import" accept=".json,application/json"></label>
      <p>備份包含學生進度與試卷，錄音留在原瀏覽器。</p>
    </section>
    <p id="settingsFeedback" role="status" aria-live="polite"></p>
  </dialog>
  <dialog id="studentsDialog" aria-labelledby="studentsTitle">
    <div class="dialog-heading"><h2 id="studentsTitle">學生與本機進度</h2><button id="closeStudents" type="button" class="secondary" aria-label="關閉學生與本機進度">✕</button></div>
    <div class="students">
      <div class="actions">
        <label class="sr-only" for="student">目前學生</label>
        <select id="student"></select>
        <label class="sr-only" for="newStudent">新學生名稱</label>
        <input id="newStudent" placeholder="新學生名稱" maxlength="30">
        <button id="addStudent" class="secondary">新增學生</button>
      </div>
      <p id="summary"></p>
      <progress id="progress" value="0" max="1" aria-label="已練習單字"></progress>
      <p id="studentsFeedback" role="status" aria-live="polite"></p>
    </div>
  </dialog>
  <main>
    <header class="hero">
      <p class="eyebrow" lang="en">THE PHONICS STUDIO</p>
      <h1><span lang="en">Phonics</span> 聽音跟讀</h1>
      <svg class="hero-art" viewBox="0 0 120 120" aria-hidden="true">
        <path d="M60 6c1 34 10 48 52 54-42 5-51 19-52 54-4-35-15-48-52-54C45 54 56 40 60 6Z" fill="none" stroke="currentColor" stroke-width="2"/>
        <path d="M60 34v52M34 60h52M43 43l34 34m0-34L43 77" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
      </svg>
    </header>

    <dialog id="hintDialog" aria-labelledby="hintDialogTitle">
      <h2 id="hintDialogTitle">提示</h2>
      <p id="hintDialogContent"></p>
      <form method="dialog"><button>關閉並繼續作答</button></form>
    </dialog>

    <section id="lesson" class="panel" aria-labelledby="unitTitle">
      <div class="lesson-heading">
        <div>
          <p class="eyebrow" id="unitNumber" lang="en"></p>
          <h2 id="unitTitle" lang="en"></h2>
        </div>
        <label class="unit-picker">教材單元 <select id="unitPicker"></select></label>
      </div>
      <details id="pronunciationSetup" hidden>
        <summary>發音判定設定</summary>
        <p>使用已部署的評估網址及課堂使用碼（Function Key）。設定會儲存在這個瀏覽器。勾選啟用後，錄音才會送往所填網址。</p>
        <label>評估網址 <input id="pronunciationUrl" type="url" placeholder="https://…/api/pronunciation"></label>
        <label>課堂使用碼 <input id="pronunciationAccess" type="password" autocomplete="off"></label>
        <button id="savePronunciation" type="button" class="secondary">儲存設定</button>
        <button id="clearPronunciation" type="button" class="secondary">清除設定</button>
        <label><input id="pronunciationConsent" type="checkbox"> 啟用發音判定</label>
        <p id="pronunciationStatus" role="status"></p>
      </details>
      <div id="stage"></div>
      <p id="feedback" role="status" aria-live="polite"></p>
    </section>

    <footer>學習進度與綜合測驗錄音儲存在這個瀏覽器。啟用發音判定時，朗讀錄音會傳送至評估服務。</footer>
  </main>
</body>
</html>
